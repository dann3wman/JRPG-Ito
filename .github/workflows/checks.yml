name: checks

# Data integrity, design-doc drift (reported, not failing), the generated game data reference,
# and a simulator smoke run of every encounter. Same as running tools/check.sh locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tools/check.sh
